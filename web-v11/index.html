<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- X 的视频地址（video.twimg.com）带别站 Referer 会回 403；跨站请求不带 Referer，站内照常 -->
<meta name="referrer" content="same-origin">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="application-name" content="拾光资讯">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="拾光资讯">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>拾光资讯</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="apple-splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="apple-splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="apple-splash-1290x2796.png">
<meta property="og:type" content="website">
<meta property="og:title" content="拾光资讯">
<meta property="og:site_name" content="拾光资讯">
<meta property="og:url" content="https://news.kwinweng.com/">
<meta property="og:image" content="https://news.kwinweng.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="拾光资讯">
<meta name="twitter:image" content="https://news.kwinweng.com/og-image.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" data-tab="channels" aria-busy="true">
  <div class="ptr" id="ptr" hidden><span class="ptr-ico" aria-hidden="true"></span><span class="ptr-txt">下拉刷新</span></div>
  <header class="top" id="top">
    <h1 class="top-heading"><button class="brand" id="chBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="drop"><span class="chname" id="chName">频道</span><span class="chev"><svg class="lucide lucide-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button></h1>
    <div class="top-act">
      <a class="health-entry" id="healthEntry" href="#/health"><span class="health-entry-dot" aria-hidden="true"></span>来源状态 <span class="health-entry-count" hidden></span></a>
      <button class="icon-btn refresh-btn" id="btnRefresh" type="button" aria-label="刷新"><svg class="lucide lucide-rotate-cw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="icon-btn" id="btnSearch" type="button" aria-label="搜索"><svg class="lucide lucide-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></button>
    </div>
  </header>
  <div class="drop-mask" id="dropMask"></div>
  <div class="drop" id="drop" role="listbox" aria-hidden="true">
    <div class="drop-list" id="dropList"></div>
    <div class="drop-foot">
      <div class="modes" role="group" aria-label="频道翻法">
        <button id="modeLR" type="button" class="on" aria-label="左右换频道" title="左右换频道"><svg class="lucide lucide-columns-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></svg><span>左右滑换频道</span></button>
        <button id="modeUD" type="button" aria-label="上下看频道" title="上下看频道"><svg class="lucide lucide-rows-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 12h18"/></svg><span>只上下刷</span></button>
      </div>
      <div class="note drop-note" id="dropNote"></div>
      <div class="refreshed" id="refreshed"></div>
    </div>
  </div>
  <div class="preview-note" id="previewNote" hidden><span></span><button type="button" aria-label="关闭说明"><svg class="lucide lucide-x" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <div class="views">
    <section class="view on" id="view-channels"><div id="channelRoot"></div></section>
    <section class="view" id="view-blogger">
      <div class="sub">
        <div class="band" id="blBand">
          <div class="band-in">
            <div><h1>博主</h1><p id="blStat"></p></div>
            <div class="band-act"><button type="button" class="bpill" data-b="fav">我的收藏</button><button type="button" class="bround" data-b="filter" aria-label="选平台"><svg class="lucide lucide-list-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h20"/><path d="M6 12h12"/><path d="M9 19h6"/></svg></button><button type="button" class="bround" data-b="next" aria-label="下一个平台"><svg class="lucide lucide-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
          </div>
        </div>
        <div class="bsheet">
          <div class="avrow"><div class="avs chips" id="platChips"></div><button type="button" class="avall" data-b="all">全部<span><svg class="lucide lucide-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span></button></div>
          <div class="list" id="bloggerList"></div>
        </div>
      </div>
    </section>
    <section class="view" id="view-hot">
      <div class="sub" id="hotSub">
        <div id="hotHost"></div>
      </div>
    </section>
    <!-- 收藏 / 搜索由 web-v11/features/*.js 通过 Rebang.register 接管 -->
    <section class="view" id="view-favorites"></section>
  </div>
  <nav class="tabbar" aria-label="底栏">
    <button class="on" data-view="channels" type="button"><svg class="lucide lucide-newspaper" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/></svg><b>频道</b></button>
    <button data-view="blogger" type="button"><svg class="lucide lucide-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg><b>博主</b></button>
    <button data-view="hot" type="button"><svg class="lucide lucide-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg><b>热搜</b></button>
    <button data-view="favorites" type="button"><svg class="lucide lucide-bookmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/></svg><b>收藏</b></button>
  </nav>
  <div class="overlay" id="search-panel" role="dialog" aria-label="搜索"></div>
  <dialog class="health-view" id="healthView" aria-labelledby="healthTitle">
    <header class="health-bar">
      <button type="button" class="rb" id="healthBack" aria-label="返回" autofocus><svg class="lucide lucide-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <div><h1 id="healthTitle">来源健康</h1><p id="healthStamp" hidden></p></div>
    </header>
    <div class="health-body" id="healthBody" role="region" aria-label="来源列表" tabindex="0"></div>
  </dialog>
  <div class="article-view" id="articleView">
    <div class="article-bar" id="artBar">
      <button type="button" class="rb back" id="btnBack" aria-label="返回"><svg class="lucide lucide-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <div class="ttl" id="articleTitle"></div>
      <button type="button" class="rb" id="btnArtMore" aria-label="更多"><svg class="lucide lucide-ellipsis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
    </div>
    <div class="article-body" id="articleBody"></div>
    <nav class="art-nav" id="artNav" aria-label="同一列表里的上一条 / 下一条" hidden></nav>
    <div class="d-bar" id="dBar" role="toolbar" aria-label="正文操作">
      <button type="button" id="dFont" aria-label="字号"><svg class="lucide lucide-a-large-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 16 2.536-7.328a1.02 1.02 1 0 1 1.928 0L22 16"/><path d="M15.697 14h5.606"/><path d="m2 16 4.039-9.69a.5.5 0 0 1 .923 0L11 16"/><path d="M3.304 13h6.392"/></svg></button>
      <button type="button" id="dFav" aria-label="收藏" aria-pressed="false"><svg class="lucide lucide-bookmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/></svg></button>
      <button type="button" id="dShare" aria-label="分享"><svg class="lucide lucide-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg></button>
      <button type="button" id="dCmt" aria-label="评论"><svg class="lucide lucide-message-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg><em id="dCmtN">评论</em></button>
    </div>
  </div>
  <div class="sheet" id="cardMenu" role="dialog" aria-label="卡片菜单" aria-hidden="true"><div class="box menu-box"></div></div>
  <div class="sheet" id="actSheet" role="dialog" aria-label="操作" aria-hidden="true"><div class="box act-box"><div class="handle"></div><div class="act-body" id="actBody"></div></div></div>
  <div class="zoom-view" id="zoomView" hidden role="dialog" aria-label="查看图片和视频" aria-modal="true">
    <button type="button" class="zoom-close" id="zoomClose" aria-label="关闭"><svg class="lucide lucide-x" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <div class="zoom-stage" id="zoomStage"></div>
    <div class="zoom-bar">
      <button type="button" id="zoomPrev" aria-label="上一个"><svg class="lucide lucide-chevron-left" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <span class="zoom-count" id="zoomCount"></span>
      <button type="button" id="zoomNext" aria-label="下一个"><svg class="lucide lucide-chevron-right" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="lib.js"></script>
<script src="health.js"></script>
<script src="app.js"></script>
<!--FEATURES-->
</body>
</html>
