<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="application-name" content="拾光热榜">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="拾光热榜">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>拾光热榜</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="apple-splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="apple-splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="apple-splash-1290x2796.png">
<meta property="og:type" content="website">
<meta property="og:title" content="拾光热榜">
<meta property="og:site_name" content="拾光热榜">
<meta property="og:url" content="https://news.kwinweng.com/">
<meta property="og:image" content="https://news.kwinweng.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="拾光热榜">
<meta name="twitter:image" content="https://news.kwinweng.com/og-image.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" aria-busy="true">
  <div class="ptr" id="ptr" hidden><span class="ptr-ico" aria-hidden="true"></span><span class="ptr-txt">下拉刷新</span></div>
  <header class="top">
    <div class="when-wrap">
      <div class="when" id="when"></div>
      <div class="refreshed" id="refreshed"></div>
    </div>
    <div class="modes" title="切换频道翻法">
      <button id="modeLR" type="button" class="on" aria-label="左右换频道" title="左右换频道">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="7.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="7.5" height="14" rx="1.5"/></svg>
      </button>
      <button id="modeUD" type="button" aria-label="上下看频道" title="上下看频道">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/></svg>
      </button>
    </div>
    <button class="icon-btn refresh-btn" id="btnRefresh" type="button" aria-label="刷新">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="btnSearch" type="button" aria-label="搜索">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    </button>
  </header>
  <div class="preview-note" id="previewNote" hidden><span></span><button type="button" aria-label="关闭说明">×</button></div>
  <div class="views">
    <section class="view on" id="view-channels"><div id="channelRoot"></div></section>
    <section class="view" id="view-blogger">
      <div class="sub">
        <div class="sticky-hd" data-sticky="blogger">
          <h2 class="ch">博主</h2>
          <div class="chips" id="platChips"></div>
        </div>
        <div class="people" id="peopleRow"></div>
        <div class="list" id="bloggerList"></div>
      </div>
    </section>
    <section class="view" id="view-hot">
      <div class="sub" id="hotSub">
        <div class="sticky-hd" data-sticky="hot">
          <h2 class="ch">热搜</h2>
          <div class="dates" id="hotDates" role="tablist" aria-label="选日期"></div>
        </div>
        <p class="desc" style="margin:0 0 10px">百度、知乎、B 站实时热搜。切日期看那天最后一次抓到的榜单。</p>
        <div id="hotHost"></div>
      </div>
    </section>
    <!-- 收藏 / 搜索由 web-v11/features/*.js 通过 Rebang.register 接管 -->
    <section class="view" id="view-favorites"></section>
  </div>
  <nav class="tabbar" aria-label="底栏">
    <button class="on" data-view="channels" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      频道
    </button>
    <button data-view="blogger" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.2-3 3.6-4.5 7-4.5S17.8 16 19 19"/></svg>
      博主
    </button>
    <button data-view="hot" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.3 2.3-5.4 3.6-7.4.3 1.9 1.2 3 2.3 3.6.2-2.9 1.6-5.4 3.9-7.5-.2 2.6.8 4.6 2.2 6.4 1.2 1.6 1.9 3.1 1.9 4.9 0 3.6-2.7 6.2-6.5 6.2h-.9z"/><path d="M12 21c-1.6 0-2.7-1.1-2.7-2.6 0-1.6 1.3-2.5 2.2-3.9.9 1.4 3.2 2.3 3.2 4 0 1.5-1.1 2.5-2.7 2.5z"/></svg>
      热搜
    </button>
    <button data-view="favorites" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 17.3l-5.2 2.8 1-5.8-4.2-4.1 5.8-.8L12 3.5l2.6 5.9 5.8.8-4.2 4.1 1 5.8z"/></svg>
      收藏
    </button>
  </nav>
  <div class="overlay" id="search-panel" role="dialog" aria-label="搜索"></div>
  <div class="more-view" id="moreView" role="dialog" aria-label="查看更多">
    <div class="article-bar">
      <button type="button" class="back" id="btnMoreBack" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        返回
      </button>
      <div class="ttl" id="moreTitle"></div>
    </div>
    <div class="more-body" id="moreBody"></div>
  </div>
  <div class="article-view" id="articleView">
    <div class="article-bar">
      <button type="button" class="back" id="btnBack" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        返回
      </button>
      <div class="ttl" id="articleTitle"></div>
    </div>
    <div class="article-body" id="articleBody"></div>
    <nav class="art-nav" id="artNav" aria-label="同一列表里的上一条 / 下一条" hidden></nav>
  </div>
  <div class="sheet" id="cardMenu" role="dialog" aria-label="卡片菜单" aria-hidden="true"><div class="box menu-box"></div></div>
  <div class="zoom-view" id="zoomView" hidden role="dialog" aria-label="查看图片" aria-modal="true">
    <div class="zoom-stage" id="zoomStage"></div>
    <div class="zoom-bar">
      <button type="button" id="zoomPrev" aria-label="上一张">‹</button>
      <span class="zoom-count" id="zoomCount"></span>
      <button type="button" id="zoomNext" aria-label="下一张">›</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="lib.js"></script>
<script src="app.js"></script>
<!--FEATURES-->
</body>
</html>
