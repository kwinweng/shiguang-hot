<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- X 的视频地址（video.twimg.com）带别站 Referer 会回 403；跨站请求不带 Referer，站内照常 -->
<meta name="referrer" content="same-origin">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="application-name" content="拾光热榜">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="拾光热榜">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>拾光热榜</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="apple-splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="apple-splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="apple-splash-1290x2796.png">
<meta property="og:type" content="website">
<meta property="og:title" content="拾光热榜">
<meta property="og:site_name" content="拾光热榜">
<meta property="og:url" content="https://news.kwinweng.com/">
<meta property="og:image" content="https://news.kwinweng.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="拾光热榜">
<meta name="twitter:image" content="https://news.kwinweng.com/og-image.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" aria-busy="true">
  <div class="ptr" id="ptr" hidden><span class="ptr-ico" aria-hidden="true"></span><span class="ptr-txt">下拉刷新</span></div>
  <header class="top">
    <div class="when-wrap">
      <div class="when" id="when"></div>
      <div class="refreshed" id="refreshed"></div>
    </div>
    <div class="modes" title="切换频道翻法">
      <button id="modeLR" type="button" class="on" aria-label="左右换频道" title="左右换频道">
        <svg class="lucide lucide-columns-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></svg>
      </button>
      <button id="modeUD" type="button" aria-label="上下看频道" title="上下看频道">
        <svg class="lucide lucide-rows-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 12h18"/></svg>
      </button>
    </div>
    <button class="icon-btn refresh-btn" id="btnRefresh" type="button" aria-label="刷新">
      <svg class="lucide lucide-rotate-cw" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="btnSearch" type="button" aria-label="搜索">
      <svg class="lucide lucide-search" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
    </button>
  </header>
  <div class="preview-note" id="previewNote" hidden><span></span><button type="button" aria-label="关闭说明"><svg class="lucide lucide-x" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <div class="views">
    <section class="view on" id="view-channels"><div id="channelRoot"></div></section>
    <section class="view" id="view-blogger">
      <div class="sub">
        <div class="sticky-hd" data-sticky="blogger">
          <h2 class="ch">博主</h2>
          <div class="chips" id="platChips"></div>
        </div>
        <div class="list" id="bloggerList"></div>
      </div>
    </section>
    <section class="view" id="view-hot">
      <div class="sub" id="hotSub">
        <div class="sticky-hd" data-sticky="hot">
          <h2 class="ch">热搜</h2>
          <div class="dates" id="hotDates" role="tablist" aria-label="选日期"></div>
        </div>
        <p class="desc" style="margin:0 0 10px">百度、知乎、B 站实时热搜。切日期看那天最后一次抓到的榜单。</p>
        <div id="hotHost"></div>
      </div>
    </section>
    <!-- 收藏 / 搜索由 web-v11/features/*.js 通过 Rebang.register 接管 -->
    <section class="view" id="view-favorites"></section>
  </div>
  <nav class="tabbar" aria-label="底栏">
    <button class="on" data-view="channels" type="button">
      <svg class="lucide lucide-layout-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      频道
    </button>
    <button data-view="blogger" type="button">
      <svg class="lucide lucide-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      博主
    </button>
    <button data-view="hot" type="button">
      <svg class="lucide lucide-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg>
      热搜
    </button>
    <button data-view="favorites" type="button">
      <svg class="lucide lucide-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
      收藏
    </button>
  </nav>
  <div class="overlay" id="search-panel" role="dialog" aria-label="搜索"></div>
  <div class="article-view" id="articleView">
    <div class="article-bar">
      <button type="button" class="back" id="btnBack" aria-label="返回">
        <svg class="lucide lucide-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        返回
      </button>
      <div class="ttl" id="articleTitle"></div>
    </div>
    <div class="article-body" id="articleBody"></div>
    <nav class="art-nav" id="artNav" aria-label="同一列表里的上一条 / 下一条" hidden></nav>
  </div>
  <div class="sheet" id="cardMenu" role="dialog" aria-label="卡片菜单" aria-hidden="true"><div class="box menu-box"></div></div>
  <div class="zoom-view" id="zoomView" hidden role="dialog" aria-label="查看图片和视频" aria-modal="true">
    <button type="button" class="zoom-close" id="zoomClose" aria-label="关闭"><svg class="lucide lucide-x" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <div class="zoom-stage" id="zoomStage"></div>
    <div class="zoom-bar">
      <button type="button" id="zoomPrev" aria-label="上一个"><svg class="lucide lucide-chevron-left" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <span class="zoom-count" id="zoomCount"></span>
      <button type="button" id="zoomNext" aria-label="下一个"><svg class="lucide lucide-chevron-right" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="lib.js"></script>
<script src="app.js"></script>
<!--FEATURES-->
</body>
</html>
