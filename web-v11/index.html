<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101114">
<title>拾光热榜</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" aria-busy="true">
  <div class="ptr" id="ptr" hidden><span class="ptr-ico" aria-hidden="true"></span><span class="ptr-txt">下拉刷新</span></div>
  <header class="top">
    <div class="when-wrap">
      <div class="when" id="when"></div>
      <div class="refreshed" id="refreshed"></div>
    </div>
    <div class="modes" title="切换频道翻法">
      <button id="modeLR" type="button" class="on" aria-label="左右换频道" title="左右换频道">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="7.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="7.5" height="14" rx="1.5"/></svg>
      </button>
      <button id="modeUD" type="button" aria-label="上下看频道" title="上下看频道">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/></svg>
      </button>
    </div>
    <button class="icon-btn refresh-btn" id="btnRefresh" type="button" aria-label="刷新">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="btnSearch" type="button" aria-label="搜索">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    </button>
  </header>
  <div class="preview-note" id="previewNote" hidden><span></span><button type="button" aria-label="关闭说明">×</button></div>
  <div class="views">
    <section class="view on" id="view-channels"><div id="channelRoot"></div></section>
    <section class="view" id="view-blogger">
      <div class="sub">
        <h2 class="ch" style="margin:0 0 6px">博主</h2>
        <p class="desc" style="margin:0 0 10px">已定的博主帖子。官方资讯在「频道」里。</p>
        <div class="chips" id="platChips"></div>
        <div class="people" id="peopleRow"></div>
        <div class="list" id="bloggerList"></div>
      </div>
    </section>
    <!-- 以下三个挂载点由 web-v11/features/*.js 通过 Rebang.register 接管（history-favorites-search 分支） -->
    <section class="view" id="view-history"></section>
    <section class="view" id="view-favorites"></section>
  </div>
  <nav class="tabbar" aria-label="底栏">
    <button class="on" data-view="channels" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      频道
    </button>
    <button data-view="blogger" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.2-3 3.6-4.5 7-4.5S17.8 16 19 19"/></svg>
      博主
    </button>
    <button data-view="history" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      历史
    </button>
    <button data-view="favorites" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 17.3l-5.2 2.8 1-5.8-4.2-4.1 5.8-.8L12 3.5l2.6 5.9 5.8.8-4.2 4.1 1 5.8z"/></svg>
      收藏
    </button>
  </nav>
  <div class="overlay" id="search-panel" role="dialog" aria-label="搜索"></div>
  <div class="article-view" id="articleView">
    <div class="article-bar">
      <button type="button" class="back" id="btnBack" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        返回
      </button>
      <div class="ttl" id="articleTitle"></div>
    </div>
    <div class="article-body" id="articleBody"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="lib.js"></script>
<script src="app.js"></script>
<!--FEATURES-->
</body>
</html>
