name: hourly
# Pages uses gh-pages/root. Rollback: revert cutover PR and select GitHub Actions.
# Manual validation only; no build or deploy jobs and no Pages write permission.
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 pillow
      - run: python -m unittest discover tests
