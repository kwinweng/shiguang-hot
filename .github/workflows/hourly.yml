name: hourly
on: {schedule: [{cron: "7 * * * *"}], workflow_dispatch: {}}
permissions: {contents: write, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: media/
          key: telegram-media-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            telegram-media-${{ runner.os }}-
      - run: pip install beautifulsoup4 pillow && SITE_MODE=public MAIL_DIGEST=0 TZ=Asia/Shanghai python3 pipeline.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add tg.db && git commit -m "data $(date -u +%FT%H)" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
